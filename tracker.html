<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отслеживание курьера 🗺️</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Подключаем карты Яндекс -->
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
<style>
  :root{
    --bg:#fdf6f0; --accent:#d94f70; --accent-soft:#fbe3ea; --text:#3a2e33; --muted:#8a7a80;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  
  .header { text-align:center; padding: 30px 20px; background: #fbe3ea; }
  .header h1 { font-family:'Marck Script',cursive; font-size: 40px; color: var(--accent); font-weight: 400; }
  .header p { font-size: 14px; color: var(--muted); margin-top: 5px; }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #c23d5e; }
  .btn-copy { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
  .btn-copy:hover { background: var(--accent); color: #fff; }
  
  .link-box { background: #fff; border: 2px dashed #f0dbe2; padding: 15px; border-radius: 12px; font-size: 14px; word-break: break-all; margin-bottom: 20px; display: none; }
  .link-box.show { display: block; }

  #map { width: 100%; height: 400px; border-radius: 16px; box-shadow: 0 4px 20px rgba(217,79,112,.15); overflow: hidden; border: 1px solid #f5e4e9; }

  .back-link { display: inline-block; margin-top: 20px; color: var(--muted); text-decoration: none; font-size: 14px; }
  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>Где курьер?</h1>
  <p>Нажми «Определить мои координаты» и скинь ссылку маме</p>
</div>

<div class="container">
  <div class="controls">
    <button class="btn btn-primary" id="btn-locate">📍 Определить мои координаты</button>
    <button class="btn btn-copy" id="btn-copy" style="display:none;">📋 Скопировать ссылку для мамы</button>
  </div>

  <div class="link-box" id="link-box"></div>

  <div id="map"></div>
  
  <a href="index.html" class="back-link">← Вернуться в магазин</a>
</div>

<script>
  let map;
  let placemark;

  ymaps.ready(init);

  function init() {
    // Центр карты — Новосибирск
    map = new ymaps.Map("map", {
      center: [55.008353, 82.935733],
      zoom: 12,
      controls: ['zoomControl', 'fullscreenControl']
    });

    // Проверяем, есть ли в ссылке координаты
    const urlParams = new URLSearchParams(window.location.search);
    const lat = urlParams.get('lat');
    const lon = urlParams.get('lon');

    if (lat && lon) {
      const coords = [parseFloat(lat), parseFloat(lon)];
      
      placemark = new ymaps.Placemark(coords, {
        balloonContent: 'Я здесь! 🚚'
      }, {
        preset: 'islands#redDotIcon'
      });
      map.geoObjects.add(placemark);
      
      map.setCenter(coords, 16);
      document.getElementById('btn-locate').style.display = 'none';
    }
  }

  document.getElementById('btn-locate').addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert('Ваш браузер не поддерживает геолокацию.');
      return;
    }

    const btn = this;
    btn.textContent = "Ищу...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const coords = [lat, lon];

        const baseUrl = window.location.origin + window.location.pathname;
        const shareLink = `${baseUrl}?lat=${lat}&lon=${lon}`;

        const linkBox = document.getElementById('link-box');
        linkBox.textContent = shareLink;
        linkBox.classList.add('show');

        const btnCopy = document.getElementById('btn-copy');
        btnCopy.style.display = 'inline-block';
        btnCopy.onclick = () => {
          navigator.clipboard.writeText(shareLink).then(() => {
            btnCopy.textContent = "✅ Скопировано!";
            setTimeout(() => { btnCopy.textContent = "📋 Скопировать ссылку для мамы"; }, 2000);
          });
        };

        if (placemark) {
          map.geoObjects.remove(placemark);
        }
        placemark = new ymaps.Placemark(coords, {
          balloonContent: 'Вы здесь! 🚚'
        }, {
          preset: 'islands#blueDotIcon'
        });
        map.geoObjects.add(placemark);
        map.setCenter(coords, 16);

        btn.textContent = "📍 Координаты найдены";
      },
      (error) => {
        let errorMsg = "Не удалось определить местоположение.";
        if (error.code === 1) errorMsg += " Разрешите доступ к геолокации.";
        if (error.code === 2) errorMsg += " Нет сигнала GPS.";
        alert(errorMsg);
        btn.textContent = "📍 Определить мои координаты";
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  });
</script>

</body>
</html>
